name: Build patched PCL2 CE

# GitHub Actions cannot natively listen to another repository's release event.
# The schedule below polls upstream and builds only releases that do not have a
# complete patched release yet.  workflow_dispatch is useful for immediate runs;
# repository_dispatch lets an external relay trigger the workflow instantly.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to build (e.g. v2.15.1). Leave empty to build the latest stable/beta."
        required: false
        type: string
  repository_dispatch:
    types: [upstream-release]

concurrency:
  group: patched-pcl2-ce
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  discover:
    name: Discover upstream releases
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.plan.outputs.builds }}
      releases: ${{ steps.plan.outputs.releases }}
      has_builds: ${{ steps.plan.outputs.has_builds }}
    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4

      - name: Plan builds
        id: plan
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REPOSITORY: PCL-Community/PCL-CE
          INPUT_TAG: ${{ inputs.tag }}
        run: python3 scripts/plan_releases.py

  build:
    name: Build ${{ matrix.version }} ${{ matrix.arch }}
    needs: discover
    if: needs.discover.outputs.has_builds == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.builds) }}
    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4
        with:
          path: patch-repo

      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: PCL-Community/PCL-CE
          ref: ${{ matrix.tag }}
          path: src
          fetch-depth: 0
          fetch-tags: true

      - name: Apply patches
        run: |
          python3 patch-repo/scripts/apply_patches.py src --repo "${{ github.repository }}"

      - name: Read upstream commit
        id: upstream
        working-directory: src
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build project
        working-directory: src
        env:
          PCL_WRITE_SECRET: "1"
          PCL_GITHUB_SHA: ${{ steps.upstream.outputs.sha }}
          # All of these are optional.  If a secret is not configured the
          # corresponding feature stays disabled, but the build still works.
          PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          PCL_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          PCL_NAID_CLIENT_ID: ${{ secrets.NAID_CLIENT_ID }}
          PCL_NAID_CLIENT_SECRET: ${{ secrets.NAID_CLIENT_SECRET }}
          PCL_LINK_SERVER_ROOT: ${{ secrets.LINK_SERVER_ROOTS }}
          PCL_LOBBY_DEFAULT_SECRET: ${{ secrets.LOBBY_DEFAULT_SECRET }}
        run: |
          dotnet publish "Plain Craft Launcher 2/Plain Craft Launcher 2.csproj" \
            -p:Configuration=${{ matrix.configuration }} \
            -p:Platform=${{ matrix.arch }} \
            -p:DeleteExistingFiles=true \
            -o "${{ github.workspace }}/artifact" \
            --no-self-contained

      - name: Rename patched binary
        shell: bash
        run: |
          set -euo pipefail
          mv "artifact/Plain Craft Launcher 2.exe" \
             "artifact/PCL2_CE_${{ matrix.configuration }}_${{ matrix.arch }}_patched.exe"

      - name: Sign patched binary
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: artifact/PCL2_CE_${{ matrix.configuration }}_${{ matrix.arch }}_patched.exe
          verify: true
          verify-cert-identity: https://github.com/${{ github.repository }}/.github/workflows/patch-release.yml@${{ github.ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com

      - name: Upload patched artifacts
        uses: actions/upload-artifact@v4
        with:
          name: patched-${{ matrix.version }}-${{ matrix.arch }}
          path: artifact/PCL2_CE_*_patched.exe*
          if-no-files-found: error

  publish:
    name: Publish ${{ matrix.version }}
    needs: [discover, build]
    if: needs.discover.outputs.has_builds == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.releases) }}
    steps:
      - name: Download patched artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: patched-${{ matrix.version }}-*
          path: dist
          merge-multiple: true

      - name: Verify artifact set
        shell: bash
        run: |
          set -euo pipefail
          ls -l dist
          test -f "dist/PCL2_CE_${{ matrix.configuration }}_x64_patched.exe"
          test -f "dist/PCL2_CE_${{ matrix.configuration }}_ARM64_patched.exe"

      - name: Prepare release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ matrix.version }}
          UPSTREAM_TAG: ${{ matrix.tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/PCL-Community/PCL-CE/releases/tags/${UPSTREAM_TAG}" --jq .body > upstream.md || true
          {
            printf '## PCL2 CE %s（Patched）\n\n' "$VERSION"
            printf '本构建由 [%s](https://github.com/%s) 自动生成，对应上游 [%s](https://github.com/PCL-Community/PCL-CE/releases/tag/%s)。\n\n' \
              "$REPOSITORY" "$REPOSITORY" "$UPSTREAM_TAG" "$UPSTREAM_TAG"
            printf '已应用补丁：\n\n'
            printf -- '- 默认隐藏启动页右侧的 PCL CE 版本提示\n'
            printf -- '- 解除中国大陆区域的 Minecraft 下载、补全与整合包安装限制\n'
            printf -- '- 默认更新改为从本仓库下载 patched 版本\n'
            printf -- '- 不登录微软账户也可以创建第三方/离线档案\n\n'
            printf '> 本构建不是 PCL-Community 官方发布，请自行判断风险。\n\n'
            if [ -s upstream.md ]; then
              printf '## 上游更新内容\n\n'
              cat upstream.md
            fi
          } > body.md

      - name: Publish patched release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ matrix.version }}-patched
          name: PCL2 CE ${{ matrix.version }} (Patched)
          body_path: body.md
          prerelease: ${{ matrix.prerelease }}
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
